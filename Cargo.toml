[package]
name = "caratls"
version = "0.1.0"
edition = "2021"
description = "Certificate Authority trusted Remote Attestation TLS"
license = "Apache-2.0"
repository = "https://github.com/pluto/caratls"
authors = ["Pluto <hello@pluto.com>"]
keywords = ["Trusted Execution Environment", "TEE", "TLS", "Certificate Authority", "Google Confidential Space", "GCS"]
categories = ["cryptography", "security", "Network-Programming"]

[dependencies]
tokio = { version = "1.42", default-features = false, features = ["io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
thiserror = "2"
rcgen = "0.13"
rustls = { version = "0.23" }
tokio-rustls = { version = "0.26" }
hyper = { version = "1.5", features = ["client", "http1"] }
http-body-util = { version = "0.1" }
hyper-util = { version = "0.1", features = ["tokio"] }
serde_json = { version = "1.0" }
hex = { version = "0.4" }
jsonwebtoken = { version = "9.3" }
reqwest = { version = "0.12" }

# Not WASM, not iOS
[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios", target_os = "ios-sim")))'.dependencies]
rustls-pki-types = { version = "1.10" }
rustls = { version = "0.23" }
tokio-rustls = { version = "0.26" }

# WASM or iOS
[target.'cfg(any(target_arch = "wasm32", target_os = "ios", target_os = "ios-sim"))'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
] }

# WASM
[target.'cfg(any(target_arch = "wasm32"))'.dependencies]
rustls-pki-types = { version = "1.10", features = ["web"] }

# iOS
[target.'cfg(any(target_os = "ios", target_os = "ios-sim"))'.dependencies]
rustls-pki-types = { version = "1.10" }


[dev-dependencies]
tokio = { version = "1.42", features = [
  "net",
  "io-util",
  "rt",
  "macros",
  "time",
] }
